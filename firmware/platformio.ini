; MOTION-X firmware: PlatformIO project.
; The same sketch also builds in the Arduino IDE (open firmware/motionx/motionx.ino).
;
;   pio run                 build
;   pio run -t upload       flash firmware
;   pio run -t uploadfs     flash the web app (run `npm run build:device` in the repo root first)
;   pio device monitor      serial log (115200)

[platformio]
src_dir = motionx
data_dir = motionx/data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
  esp32async/ESPAsyncWebServer @ ^3.7.0
  esp32async/AsyncTCP @ ^3.3.0
  bblanchon/ArduinoJson @ ^7.0.0
  z3t0/IRremote @ ^4.4.0
  ; Uncomment when USE_INA219 is 1 in config.h:
  ; adafruit/Adafruit INA219 @ ^1.2.3
